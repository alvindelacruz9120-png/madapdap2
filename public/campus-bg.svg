    <rect x="560" y="430" width="480" height="270" rx="4" />
    <polygon points="540,430 800,340 1060,430" fill="#0f172a" />
    <rect x="1080" y="470" width="340" height="230" rx="4" />
    <polygon points="1060,470 1250,395 1440,470" fill="#0f172a" />
  </g>
  <!-- Illuminated Campus Windows -->
  <g fill="#fbbf24" opacity="0.22">
    <rect x="220" y="510" width="45" height="32" rx="2" />
    <rect x="290" y="510" width="45" height="32" rx="2" />
    <rect x="360" y="510" width="45" height="32" rx="2" />
    <rect x="430" y="510" width="45" height="32" rx="2" />
    <rect x="620" y="480" width="55" height="36" rx="2" />
    <rect x="705" y="480" width="55" height="36" rx="2" />
    <rect x="840" y="480" width="55" height="36" rx="2" />
    <rect x="925" y="480" width="55" height="36" rx="2" />
    <rect x="1120" y="510" width="45" height="32" rx="2" />
    <rect x="1190" y="510" width="45" height="32" rx="2" />
    <rect x="1260" y="510" width="45" height="32" rx="2" />
    <rect x="1330" y="510" width="45" height="32" rx="2" />
